services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gounow_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gounow
      DB_USERNAME: gounow_user
      DB_PASSWORD: gounow_secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gounow_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: gounow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gounow_network

  # MySQL 8.0 Database
  db:
    image: mysql:8.0
    container_name: gounow_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: gounow
      MYSQL_USER: gounow_user
      MYSQL_PASSWORD: gounow_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - gounow_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gounow_network

  # Redis In-Memory Cache, Sessions & Queues
  redis:
    image: redis:7-alpine
    container_name: gounow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gounow_redis_data:/data
    networks:
      - gounow_network

  # Asynchronous Background Queue Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gounow_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=critical,notifications,default,media --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gounow
      DB_USERNAME: gounow_user
      DB_PASSWORD: gounow_secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - db
      - redis
    networks:
      - gounow_network

networks:
  gounow_network:
    driver: bridge

volumes:
  gounow_db_data:
    driver: local
  gounow_redis_data:
    driver: local
