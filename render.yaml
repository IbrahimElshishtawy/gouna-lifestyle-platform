services:
  - type: web
    name: gouna-lifestyle-platform
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: CONTAINER_ROLE
        value: web
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: gounow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gounow-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: gounow-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: gounow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gounow-postgres
          property: password
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: s3

  - type: worker
    name: gouna-lifestyle-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        fromService:
          type: web
          name: gouna-lifestyle-platform
          envVarKey: APP_KEY
      - key: CONTAINER_ROLE
        value: worker
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: gounow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gounow-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: gounow-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: gounow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gounow-postgres
          property: password
      - key: RUN_MIGRATIONS
        value: "false"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: s3

databases:
  - name: gounow-postgres
    databaseName: gounow_production
    user: gounow_user
    plan: starter
    region: frankfurt
    postgresMajorVersion: "16"
